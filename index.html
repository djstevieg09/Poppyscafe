<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3a2a22">
<title>Poppy's Café Rush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #3a2a22; --cream: #fff6e5; --peach: #ffb4a2; --pink: #ff6b9a; --mint: #38c9a6;
  --orange: #ff922b; --purple: #7048e8; --yellow: #ffd43b; --bg: #3a2a22;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #3a2a22; } }
:root[data-theme="dark"] { --bg: #3a2a22; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); font-family: Fredoka, system-ui, sans-serif; color: var(--ink); user-select: none; -webkit-user-select: none; touch-action: none; }
button { font-family: inherit; cursor: pointer; }
.screen { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; }
.screen.active { display: flex; }
#play { background: var(--bg); }
#game { position: absolute; inset: 0; touch-action: none; }

/* buttons */
.big { display: block; width: min(320px, 82vw); margin: 10px auto; padding: 16px 20px; font-size: 24px; font-weight: 700; color: #fff; background: var(--orange); border: 4px solid var(--ink); border-radius: 22px; box-shadow: 0 6px 0 var(--ink); transition: transform .08s; }
.big:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--ink); }
.big.alt { background: var(--mint); }
.big.purple { background: var(--purple); }
.big:disabled { opacity: .6; }
.link { background: none; border: 0; color: var(--ink); font-size: 17px; font-weight: 600; text-decoration: underline; padding: 8px; display: block; margin: 0 auto; }
.small { padding: 8px 14px; font-size: 17px; font-weight: 700; color: #fff; background: var(--purple); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 0 4px 0 var(--ink); }
.small:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.coins { white-space: nowrap; color: var(--ink); font-weight: 700; font-size: 18px; background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px 12px; }

/* title */
#title { background: radial-gradient(circle at 50% 30%, #ffe5d0, #ffb4a2 60%, #e5989b); justify-content: center; padding: 16px; }
#title .logo { text-align: center; margin-bottom: 4px; }
#title h1 { margin: 0; font-size: clamp(40px, 11vw, 64px); line-height: .95; color: #fff; -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 6px 0 var(--ink); letter-spacing: 1px; }
#title h1 span { color: var(--yellow); }
#title .tag { font-weight: 600; font-size: 18px; margin-top: 10px; }
#title-art { width: min(300px, 70vw); height: auto; aspect-ratio: 1; }
#btn-dev { font-size: 14px; opacity: .7; }

/* map */
#map { background: #ffe5d0; }
.topbar { width: 100%; max-width: 720px; display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 16px; background: var(--ink); color: #fff; }
.topbar h2 { margin: 0; font-size: 22px; }
#pack-tabs { width: 100%; max-width: 720px; display: flex; gap: 8px; overflow-x: auto; padding: 10px 16px; touch-action: pan-x; scrollbar-width: none; }
.tab { flex: none; padding: 8px 14px; border: 3px solid var(--ink); border-radius: 14px; background: #fff; font-weight: 700; font-size: 16px; }
.tab.on { background: var(--yellow); }
#level-list { width: 100%; max-width: 720px; flex: 1; overflow-y: auto; padding: 0 16px 40px; touch-action: pan-y; -webkit-overflow-scrolling: touch; }
.cafe { background: var(--wall); border: 4px solid var(--ink); border-radius: 22px; padding: 12px; margin: 12px 0 18px; box-shadow: 0 6px 0 var(--ink); }
.cafe h3 { margin: 0 0 10px; font-size: 20px; color: #fff; -webkit-text-stroke: 1.5px var(--ink); paint-order: stroke fill; }
.cafe h3 small { font-size: 14px; }
.grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.lvl { aspect-ratio: 1; border: 3px solid var(--ink); border-radius: 16px; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; box-shadow: 0 4px 0 var(--ink); }
.lvl .num { font-size: 22px; font-weight: 700; line-height: 1; }
.lvl .st { font-size: 12px; color: #f59f00; letter-spacing: -1px; margin-top: 2px; }
.lvl.locked { background: #e9ecef; color: #868e96; }
.lvl.locked .st { color: #495057; font-size: 15px; font-weight: 700; }
.lvl.current { background: var(--yellow); animation: bob 1s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-4px); } }

/* intro & results */
#intro, #results, #shop { background: radial-gradient(circle at 50% 20%, #fff6e5, var(--wall, #ffb4a2)); justify-content: center; padding: 16px; }
.panel { width: min(440px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 28px; padding: 22px 20px; text-align: center; box-shadow: 0 8px 0 var(--ink); }
.panel h2 { margin: 0; font-size: 34px; }
.panel .sub { font-size: 18px; font-weight: 600; color: #8b5e3c; }
.targets { display: flex; gap: 10px; justify-content: center; margin: 16px 0; }
.targets div { flex: 1; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px 6px; font-size: 14px; font-weight: 600; }
.targets b { display: block; font-size: 26px; }
#intro-new { background: #e5dbff; border: 3px dashed var(--purple); border-radius: 16px; padding: 10px; margin: 8px 0 12px; font-size: 16px; }
#res-stars { font-size: 64px; line-height: 1; margin: 10px 0; }
#res-stars span { color: #dee2e6; -webkit-text-stroke: 3px var(--ink); display: inline-block; }
#res-stars span.on { color: var(--yellow); animation: pop .5s both; }
@keyframes pop { 0% { transform: scale(0) rotate(-30deg); } 70% { transform: scale(1.3); } 100% { transform: scale(1); } }
#res-score { font-size: 48px; font-weight: 700; }
#res-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 14px 0; }
#res-stats div { background: #fff; border: 3px solid var(--ink); border-radius: 14px; padding: 6px; font-size: 14px; }
#res-stats b { display: block; font-size: 22px; }
#res-coins { font-size: 22px; font-weight: 700; color: #e67700; }
.row { display: flex; gap: 10px; justify-content: center; }
.row .big { width: auto; flex: 1; font-size: 20px; padding: 12px 8px; }

/* shop */
#shop .panel { max-height: 92vh; display: flex; flex-direction: column; }
#shop-list { overflow-y: auto; touch-action: pan-y; margin: 12px 0; text-align: left; }
.up { display: flex; align-items: center; gap: 10px; background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 10px; margin-bottom: 10px; }
.up .ic { font-size: 34px; }
.up .tx { flex: 1; display: flex; flex-direction: column; font-size: 14px; }
.up .tx b { font-size: 18px; }
.up .tx i { font-style: normal; color: var(--purple); letter-spacing: 2px; }
.up button { padding: 8px 10px; min-width: 84px; font-weight: 700; font-size: 16px; border: 3px solid var(--ink); border-radius: 12px; background: var(--yellow); }
.up button:disabled { background: #e9ecef; color: #868e96; }

/* modal */
#modal { position: fixed; inset: 0; background: rgba(30,20,15,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
#modal.open { display: flex; }
#modal .card { width: min(400px, 100%); background: var(--cream); border: 4px solid var(--ink); border-radius: 28px; padding: 22px 18px; text-align: center; box-shadow: 0 8px 0 var(--ink); animation: pop .3s both; }
#modal h2 { margin: 4px 0 8px; font-size: 30px; }
#modal p { font-size: 17px; margin: 6px 0; }
.pw-badge { font-size: 46px; }
.perks { text-align: left; display: inline-block; margin: 8px auto; padding-left: 22px; font-size: 16px; font-weight: 500; }
.note { font-size: 13px !important; color: #868e96; }

/* motion */
.screen.active { animation: screenIn .35s cubic-bezier(.2,.9,.3,1.2) both; }
@keyframes screenIn { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
#play.screen.active { animation: fadeIn .3s both; }
@keyframes fadeIn { from { opacity: 0; } }
.panel { animation: pop .45s cubic-bezier(.2,1.4,.4,1) both; }
#title h1 { animation: logoBob 2.8s ease-in-out infinite; display: inline-block; }
@keyframes logoBob { 50% { transform: translateY(-6px) rotate(-1.5deg); } }
#btn-play, #btn-intro-start, #btn-res-next { animation: breathe 1.6s ease-in-out infinite; }
@keyframes breathe { 50% { transform: scale(1.04); } }
.big:active, .lvl:active, .small:active { animation: none; }
.cafe { animation: rise .4s both; }
.cafe:nth-child(2) { animation-delay: .05s; } .cafe:nth-child(3) { animation-delay: .1s; } .cafe:nth-child(4) { animation-delay: .15s; }
@keyframes rise { from { opacity: 0; transform: translateY(18px); } }
.lvl { transition: transform .12s; }
.lvl:hover { transform: translateY(-3px) rotate(-2deg); }
.up { animation: rise .35s both; }
#title::before, #title::after { content: ""; position: absolute; width: 140px; height: 140px; border-radius: 50%; background: rgba(255,255,255,.18); animation: drift 9s ease-in-out infinite; pointer-events: none; }
#title::before { top: 8%; left: -30px; } #title::after { bottom: 10%; right: -40px; width: 200px; height: 200px; animation-delay: -4s; }
@keyframes drift { 50% { transform: translate(30px, -20px) scale(1.1); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

#toast { position: fixed; left: 50%; bottom: 40px; transform: translate(-50%, 30px); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 16px; font-weight: 600; opacity: 0; transition: .25s; z-index: 20; pointer-events: none; max-width: 90vw; text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
</style>
</head>
<body>

<div id="title" class="screen active">
  <canvas id="title-art" width="600" height="600"></canvas>
  <div class="logo">
    <h1>Poppy's<br><span>Café Rush</span></h1>
    <div class="tag">Seat 'em, serve 'em, keep 'em smiling!</div>
  </div>
  <button class="big" id="btn-play">Play</button>
  <div class="row"><button class="link" id="btn-music">🎵 Music: On</button><button class="link" id="btn-sound">🔊 Sound: On</button></div>
  <button class="link" id="btn-dev" hidden>Test mode: open levels 1–120</button>
</div>

<div id="map" class="screen">
  <div class="topbar">
    <button class="small" id="btn-map-back">◀</button>
    <h2>Pick a level</h2>
    <span class="coins">🪙 0</span>
    <button class="small" id="btn-map-shop">Shop</button>
  </div>
  <div id="pack-tabs"></div>
  <div id="level-list"></div>
</div>

<div id="intro" class="screen">
  <div class="panel">
    <div class="sub" id="intro-cafe"></div>
    <h2 id="intro-level"></h2>
    <div class="targets">
      <div><b id="intro-goal"></b>Goal</div>
      <div><b id="intro-expert"></b>Expert</div>
      <div><b id="intro-guests"></b>Guests</div>
    </div>
    <div id="intro-new"></div>
    <div class="sub" id="intro-best"></div>
    <button class="big" id="btn-intro-start">Open the café!</button>
    <button class="link" id="btn-intro-back">Back to map</button>
  </div>
</div>

<div id="play" class="screen"><canvas id="game"></canvas></div>

<div id="results" class="screen">
  <div class="panel">
    <h2 id="res-title"></h2>
    <div id="res-stars"></div>
    <div id="res-score"></div>
    <div class="sub" id="res-goal"></div>
    <div id="res-stats"></div>
    <div id="res-coins"></div>
    <button class="big" id="btn-res-next">Next level ▶</button>
    <div class="row">
      <button class="big alt" id="btn-res-retry">Retry</button>
      <button class="big purple" id="btn-res-shop">Shop</button>
    </div>
    <button class="link" id="btn-res-map">Level map</button>
  </div>
</div>

<div id="shop" class="screen">
  <div class="panel">
    <h2>Café Upgrades</h2>
    <div style="margin-top:8px"><span class="coins">🪙 0</span></div>
    <div id="shop-list"></div>
    <button class="big" id="btn-shop-back">Done</button>
  </div>
</div>

<div id="modal"><div class="card"></div></div>
<div id="toast"></div>

<script type="module" src="src/main.js"></script>
</body>
</html>
